name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer tag to publish, for example v0.1.0-alpha.2"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"

      - name: Validate exact release commit
        run: bash scripts/validate-repository.sh

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $VERSION" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "Tag already exists: $VERSION" >&2
            exit 1
          fi

      - name: Build source ZIP
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ARCHIVE="workflow-${VERSION}.zip"
          git archive --format=zip --prefix="workflow-${VERSION}/" HEAD -o "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARCHIVE="workflow-${VERSION}.zip"
          release_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$VERSION" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Workflow ${VERSION}" \
            --generate-notes \
            "${release_args[@]}"
